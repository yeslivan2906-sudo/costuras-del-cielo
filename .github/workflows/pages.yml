# Publica el juego en GitHub Pages cada vez que se sube algo a main.
# Arma el paquete de imágenes (no está en git) y sube solo lo que el juego necesita.
name: Publicar el juego (GitHub Pages)
# Ahora la página se sirve directo de la rama main (Settings → Pages → Deploy from a branch), así que este
# flujo queda solo para lanzarlo a mano si algún día se cambia la fuente a «GitHub Actions».
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Armar el paquete de imágenes
        run: python3 herramientas/empaquetar_assets.py
      - name: Preparar la página
        run: |
          mkdir -p sitio/lib sitio/assets/menus
          cp index.html sitio/
          cp lib/phaser.min.js sitio/lib/
          cp assets/paquete_assets.js sitio/assets/
          cp assets/menus/titulo_video.mp4 sitio/assets/menus/
          touch sitio/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
